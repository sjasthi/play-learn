<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Play and Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="pl-login-wrap">
  <div class="pl-card pl-login-card">

    <div class="text-center mb-4">
      <a href="index.html" class="pl-brand">Play &amp; Learn</a>
      <div class="text-muted mt-1" style="font-size:14px;">Log in to continue</div>
    </div>

    <!--
      This form posts to the backend login endpoint.
      Backend (Teammate 2) reads users.email + users.password_hash,
      checks the role column, then redirects:
        role = 'admin'   -> admin/dashboard.html
        role = 'student' -> pages/dashboard.html
        role = 'parent'  -> parent/dashboard.html
    -->
    <form id="loginForm" action="/api/login.php" method="POST" novalidate>

      <div id="loginError" class="alert alert-danger py-2 px-3 d-none" style="font-size:14px;border-radius:10px;" role="alert"></div>

      <div class="mb-3">
        <label for="email" class="pl-form-label form-label">Email</label>
        <input type="email" class="form-control pl-input" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="mb-3">
        <label for="password" class="pl-form-label form-label">Password</label>
        <input type="password" class="form-control pl-input" id="password" name="password" placeholder="••••••••" required minlength="6">
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="remember" name="remember">
        <label class="form-check-label" for="remember" style="font-size:14px;color:var(--pl-muted);">
          Remember me
        </label>
      </div>

      <button type="submit" class="btn btn-pl-primary w-100" id="loginBtn">Log In</button>

      <div class="text-center mt-3" style="font-size:13px;color:var(--pl-muted);">
        Forgot your password? <a href="#" style="color:var(--pl-accent);">Reset it</a>
      </div>
    </form>

  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/login.js"></script>
</body>
</html>
