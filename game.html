<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match the Output — Play and Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>

<nav class="pl-navbar">
  <div class="container d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-4">
      <a href="dashboard.html" class="pl-brand">Play &amp; Learn</a>
      <div class="d-none d-md-flex gap-4">
        <a href="dashboard.html" class="pl-navlink">Dashboard</a>
        <a href="quiz.html" class="pl-navlink">Quizzes</a>
        <a href="game.html" class="pl-navlink active">Games</a>
        <a href="#" class="pl-navlink">Progress</a>
      </div>
    </div>
    <div class="d-flex align-items-center gap-2">
      <div class="pl-avatar" id="userInitial">A</div>
      <span id="userFirstName" style="font-weight:500;font-size:15px;">Alex</span>
    </div>
  </div>
</nav>

<div class="container py-5">

  <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
    <div>
      <a href="dashboard.html" style="font-size:13px;color:var(--pl-muted);text-decoration:none;">&larr; Back to dashboard</a>
      <!-- PHP: echo htmlspecialchars($lesson['title']); -->
      <h1 class="pl-display mt-2 mb-1" style="font-size:28px;font-weight:600;" id="gameTitle">Match the Output</h1>
      <div class="text-muted" style="font-size:15px;max-width:520px;" id="gameSubtitle">
        Python 101 &middot; Loops &amp; Conditionals. Pick a code card, then pick the output it prints.
      </div>
    </div>
    <div class="d-flex gap-2">
      <div class="pl-card text-center px-3 py-2" style="min-width:90px;">
        <div style="font-size:11px;color:var(--pl-muted-light);text-transform:uppercase;letter-spacing:.04em;">Score</div>
        <div class="pl-display" style="font-size:22px;font-weight:600;color:var(--pl-accent);" id="scoreValue">0</div>
      </div>
      <div class="pl-card text-center px-3 py-2" style="min-width:90px;">
        <div style="font-size:11px;color:var(--pl-muted-light);text-transform:uppercase;letter-spacing:.04em;">Matched</div>
        <div class="pl-display" style="font-size:22px;font-weight:600;" id="matchedValue">0/4</div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-6">
      <div style="font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--pl-muted);text-transform:uppercase;" class="mb-3">Code snippet</div>
      <!-- Cards generated by js/game.js from lessons.game_data (JSON) -->
      <div id="codeCards" class="d-flex flex-column gap-3"></div>
    </div>
    <div class="col-md-6">
      <div style="font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--pl-muted);text-transform:uppercase;" class="mb-3">Output</div>
      <div id="outputCards" class="d-flex flex-column gap-3"></div>
    </div>
  </div>

  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mt-4 pt-4" style="border-top:1px solid var(--pl-border);">
    <div style="font-size:14px;color:var(--pl-muted);" id="gameMessage">Pick a code card to begin.</div>
    <div class="d-flex gap-2">
      <button class="btn btn-pl-ghost" id="resetBtn">Reset</button>
      <!-- On click: POST result to lesson_progress (and quiz_attempts if the game counts as scored) -->
      <button class="btn btn-pl-primary" id="finishBtn">Finish game</button>
    </div>
  </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../js/game.js"></script>
</body>
</html>
