<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Play and Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>

<nav class="pl-navbar">
  <div class="container d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-4">
      <a href="dashboard.html" class="pl-brand">Play &amp; Learn</a>
      <div class="d-none d-md-flex gap-4">
        <a href="dashboard.html" class="pl-navlink">Dashboard</a>
        <a href="quiz.html" class="pl-navlink active">Quizzes</a>
        <a href="game.html" class="pl-navlink">Games</a>
        <a href="#" class="pl-navlink">Progress</a>
      </div>
    </div>
    <div class="d-flex align-items-center gap-2">
      <div class="pl-avatar" id="userInitial">A</div>
      <span id="userFirstName" style="font-weight:500;font-size:15px;">Alex</span>
    </div>
  </div>
</nav>

<div class="container py-5 d-flex justify-content-center">
  <div style="width:100%;max-width:720px;">

    <div class="mb-4">
      <a href="dashboard.html" style="font-size:13px;color:var(--pl-muted);text-decoration:none;">&larr; Back to dashboard</a>
      <div class="d-flex justify-content-between align-items-baseline mt-2">
        <!-- PHP: echo htmlspecialchars($quiz['title']); -->
        <h1 class="pl-display mb-0" style="font-size:26px;font-weight:600;" id="quizTitle">Python 101: Variables &amp; Data Types</h1>
        <!-- JS: "Question " + currentIndex + " of " + questions.length -->
        <div style="font-size:13px;color:var(--pl-muted);" id="quizProgressLabel">Question 1 of 1</div>
      </div>
      <div class="pl-progress mt-3">
        <div class="pl-progress-fill" id="quizProgressFill" style="width:0%;"></div>
      </div>
    </div>

    <div class="pl-card p-4 mb-4">
      <div style="font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--pl-accent);text-transform:uppercase;" class="mb-2">Question</div>
      <!-- PHP: echo nl2br(htmlspecialchars($question['question_text'])); -->
      <div class="pl-mono" id="questionCode" style="font-size:15px;line-height:1.6;background:var(--pl-bg);border-radius:10px;padding:16px 18px;white-space:pre;"></div>
      <div style="font-size:16px;margin-top:14px;" id="questionPrompt">What does this code print?</div>

      <!-- Options generated from answer_options WHERE question_id = ? -->
      <div id="optionsList" class="d-flex flex-column gap-2 mt-3"></div>
    </div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
      <div style="font-size:14px;color:var(--pl-muted);" id="quizFeedback">Choose an answer to check it.</div>
      <div class="d-flex gap-2">
        <button class="btn btn-pl-ghost" id="skipBtn">Skip</button>
        <button class="btn btn-pl-primary" id="nextBtn" disabled>Next question</button>
      </div>
    </div>

  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../js/quiz.js"></script>
</body>
</html>
